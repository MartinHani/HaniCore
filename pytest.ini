[pytest]
# The pytest suites are in tests/unit/. Every other gate is a script run by
# tests/run_gates.py (it also runs these suites); `py -m pytest` alone covers
# only the pytest-style tests.
testpaths = tests/unit
# release/ bundles ship copies of old tests that cannot import; a bundle is
# evidence of what was shipped, never the thing under test.
norecursedirs = .git .venv reference build release tmp bins
